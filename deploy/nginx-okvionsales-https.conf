# =============================================================================
#  okvionsales.ru — HTTPS (TLS) конфиг для host-nginx
#  Ставится ПОСЛЕ получения сертификата (certbot certonly). См. гайд:
#  deploy/УСТАНОВКА-PWA-и-Google-Play.md
#
#  Что делает:
#   • порт 80  → отвечает на проверку Let's Encrypt и редиректит на https;
#   • порт 443 → TLS + тот же проксинг, что и сейчас;
#   • сохраняет ВебСокет (Upgrade/Connection) для Vite HMR — живая перезагрузка не ломается;
#   • сохраняет /api/ ровно как сейчас (слэш на конце proxy_pass срезает префикс /api);
#   • отдаёт /.well-known/assetlinks.json для Google Play (Digital Asset Links).
# =============================================================================

# --- порт 80: проверка сертификата + редирект на https ---
server {
    listen 80;
    listen [::]:80;
    server_name okvionsales.ru www.okvionsales.ru;

    # Let's Encrypt должен достучаться сюда и после включения редиректа (для продления)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- порт 443: основной сайт по HTTPS ---
server {
    # HTTP/2 включаем прямо в listen — работает и на старом nginx (1.18, Ubuntu 20.04),
    # и на новом. HTTP/2 мультиплексирует запросы в ОДНОМ соединении — критично для
    # айфона/мобильных данных: без него Safari открывает ~6 соединений и захлёбывается.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name okvionsales.ru www.okvionsales.ru;

    ssl_certificate     /etc/letsencrypt/live/okvionsales.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okvionsales.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Google Play: Digital Asset Links. Точное совпадение пути — nginx отдаёт файл сам,
    # НЕ проксируя в Vite (у dev-сервера точечные каталоги /.well-known/ работают ненадёжно).
    location = /.well-known/assetlinks.json {
        alias /var/www/okvion/.well-known/assetlinks.json;
        default_type application/json;
    }

    # Бэкенд API — оставлено КАК СЕЙЧАС. Слэш в http://localhost:3000/ срезает префикс /api.
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Распознавание фото накладной (vision-модель) может считаться дольше 30с —
        # иначе nginx рвёт соединение и клиент видит 502/503/504.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        # Фото накладных/чеков (сжимаются на клиенте, но даём запас против 413).
        client_max_body_size 12m;
    }

    # Фронтенд → nginx-статик в контейнере (dist). Без WebSocket/Upgrade: раньше
    # тут был vite preview с HMR, и безусловный `Connection: upgrade` + таймаут
    # 3600s копили полуоткрытые соединения на мобильных сетях → сайт «не грузился».
    location / {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
