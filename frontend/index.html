<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NoorCoffe — Касса и склад</title>

    <!-- PWA / установка на домашний экран -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#060c1c" />
    <meta name="application-name" content="NoorCoffe" />
    <meta name="description" content="Касса, склад, долги, расходы и аналитика кофейни — в одном приложении." />

    <!-- iOS: домашний экран и статус-бар -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="NoorCoffe" />
    <script>
      // Применяем тему до рендера, чтобы не было вспышки.
      (function () {
        try {
          var t = localStorage.getItem("sales_app_theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
          // Применяем кастомное оформление (движок тем) до рендера — без вспышки.
          var css = localStorage.getItem("sales_app_appearance_css");
          if (css) {
            var s = document.createElement("style");
            s.id = "appearance-style";
            s.textContent = css;
            document.head.appendChild(s);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
