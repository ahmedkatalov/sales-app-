# Статик-сервер для собранного фронта (dist) ВНУТРИ контейнера.
# Пришёл на смену `vite preview` — тот однопроцессный и захлёбывался на мобильных
# сетях/айфоне (много параллельных соединений), из-за чего сайт «не открывался».
# nginx — многопроцессный, держит тысячи соединений, правильный keep-alive и кэш.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие текстовых ресурсов — меньше трафик, быстрее на мобильных данных.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Хешированные ассеты (…-<hash>.js/.css) не меняются — кэшируем надолго.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Оболочка, service worker и манифест — без кэша, чтобы обновления доходили
    # сразу (иначе айфон цеплялся за старую версию и «не грузил» после деплоя).
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SPA: любой маршрут (/pos, /work, …) отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
